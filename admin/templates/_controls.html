{# Language + contrast controls. Plain GET forms/links, no scripting, so they work with a
   screen reader, a keyboard, and no JavaScript. Nothing auto-submits on change. #}
<div class="controls">
  <form action="{{ url_for('set_language') }}" method="get" class="lang-form">
    <label for="lang-select">{{ _("Language") }}</label>
    <select id="lang-select" name="lang">
      {% for code, native in languages.items() %}
        <option value="{{ code }}" lang="{{ code }}" {{ 'selected' if code == locale }}>{{ native }}</option>
      {% endfor %}
    </select>
    <input type="hidden" name="next" value="{{ request.full_path.rstrip('?') }}">
    <button class="btn btn-quiet" type="submit">{{ _("Apply") }}</button>
  </form>
  {% if theme == 'contrast' %}
    <a href="{{ url_for('set_theme', theme='auto', next=request.full_path.rstrip('?')) }}">{{ _("Use standard contrast") }}</a>
  {% else %}
    <a href="{{ url_for('set_theme', theme='contrast', next=request.full_path.rstrip('?')) }}">{{ _("Use high contrast") }}</a>
  {% endif %}
</div>
