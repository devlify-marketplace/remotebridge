<!DOCTYPE html>
<html lang="{{ locale }}" data-theme="{{ theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ _("Sign in") }} · {{ _("Admin Console") }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">{{ _("Skip to main content") }}</a>
  <main class="login-wrap" id="main" tabindex="-1">
    <div class="login-box">
      <h1>{{ branding.display_name }}</h1>
      <div class="subtitle">{{ _("Admin console") }}</div>
      <div class="panel">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="flash flash-{{ 'error' if category == 'error' else 'ok' }}" role="{{ 'alert' if category == 'error' else 'status' }}">{{ message }}</div>
          {% endfor %}
        {% endwith %}
        <form method="post">
          {{ csrf_input() }}
          <label for="username">{{ _("Username") }}</label>
          <input type="text" id="username" name="username" autocomplete="username" autofocus required>
          <label for="password">{{ _("Password") }}</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
          <button class="btn" type="submit" style="width:100%;margin-top:18px;">{{ _("Sign in") }}</button>
        </form>
      </div>
      {% include "_controls.html" %}
    </div>
  </main>
</body>
</html>
