name: RemoteBridge CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f desktop/requirements.txt ]; then pip install -r desktop/requirements.txt; fi
          if [ -f admin/requirements.txt ]; then pip install -r admin/requirements.txt; fi

      - name: Run Python unit & e2e test suite
        run: |
          python3 -m unittest discover -s tests -p "test_*.py"

  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: remotebridge_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f desktop/requirements.txt ]; then pip install -r desktop/requirements.txt; fi
          if [ -f admin/requirements.txt ]; then pip install -r admin/requirements.txt; fi

      - name: Run Admin Postgres integration tests
        env:
          PG_TEST_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/remotebridge_test
        run: |
          python3 tests/run_admin_on_postgres.py


  flutter-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Analyze Controller App
        run: |
          cd mobile/controller
          flutter pub get
          flutter analyze

      - name: Analyze Host App
        run: |
          cd mobile/host
          flutter pub get
          flutter analyze
